<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Caller — Ops Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .refresh { color: var(--muted); font-size: 0.875rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
    .card.spend .value { color: var(--amber); }
    .card.booked .value { color: var(--green); }
    .card.active .value { color: var(--accent); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .outcome { font-size: 0.85rem; padding: 0.15rem 0.5rem; border-radius: 4px; background: rgba(255,255,255,0.08); }
    .error { color: var(--red); padding: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>AI Warm Caller</h1>
    <span class="refresh" id="lastRefresh">Loading…</span>
  </header>

  <div class="grid" id="stats">
    <div class="card"><div class="label">Pending Queue</div><div class="value" id="pending">—</div></div>
    <div class="card active"><div class="label">Active Calls</div><div class="value" id="active">—</div></div>
    <div class="card"><div class="label">Calls Today</div><div class="value" id="callsToday">—</div></div>
    <div class="card booked"><div class="label">Booked Today</div><div class="value" id="bookedToday">—</div></div>
    <div class="card"><div class="label">Needs Human</div><div class="value" id="needsHuman">—</div></div>
    <div class="card spend"><div class="label">Spend Today</div><div class="value" id="spend">—</div></div>
  </div>

  <h2 style="margin-bottom: 1rem; font-size: 1.1rem;">Recent Attempts</h2>
  <table>
    <thead>
      <tr>
        <th>Contact</th>
        <th>Outcome</th>
        <th>Duration</th>
        <th>Cost</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="recentBody">
      <tr><td colspan="5">Loading…</td></tr>
    </tbody>
  </table>

  <script>
    async function refresh() {
      try {
        const res = await fetch('/api/dashboard');
        const data = await res.json();
        document.getElementById('pending').textContent = data.pending_queue;
        document.getElementById('active').textContent = data.active_calls;
        document.getElementById('callsToday').textContent = data.calls_today;
        document.getElementById('bookedToday').textContent = data.booked_today;
        document.getElementById('needsHuman').textContent = data.needs_human_today;
        document.getElementById('spend').textContent = '$' + data.spend_today.toFixed(2);

        const tbody = document.getElementById('recentBody');
        if (!data.recent_attempts.length) {
          tbody.innerHTML = '<tr><td colspan="5">No calls yet</td></tr>';
        } else {
          tbody.innerHTML = data.recent_attempts.map(r => `
            <tr>
              <td>${r.contact_id.slice(0, 12)}…</td>
              <td><span class="outcome">${r.outcome || '—'}</span></td>
              <td>${r.duration_seconds ? r.duration_seconds + 's' : '—'}</td>
              <td>${r.cost != null ? '$' + Number(r.cost).toFixed(2) : '—'}</td>
              <td>${r.created_at.replace('T', ' ').slice(0, 19)}</td>
            </tr>
          `).join('');
        }
        document.getElementById('lastRefresh').textContent =
          'Updated ' + new Date().toLocaleTimeString() + ' · auto-refresh 30s';
      } catch (e) {
        document.getElementById('lastRefresh').innerHTML =
          '<span class="error">Failed to load — is the webhook server running?</span>';
      }
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
